<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="sGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric 'S' Monogram (Folds & Precision Offset Layers) -->
  <g transform="translate(6, 6)">
    <!-- Base Layer / Shadow Plate -->
    <path d="M 12 4 L 40 4 C 46.6 4 52 9.4 52 16 C 52 22.6 46.6 28 40 28 L 22 28 C 17.6 28 14 31.6 14 36 C 14 40.4 17.6 44 22 44 L 50 44" 
          fill="none" stroke="url(#sGrad3)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" />
    
    <!-- Top Geometric Curve (Cyan Precision) -->
    <path d="M 46 8 L 18 8 C 11.4 8 6 13.4 6 20 C 6 26.6 11.4 32 18 32 L 34 32 C 40.6 32 46 37.4 46 44 C 46 50.6 40.6 56 34 56 L 6 56" 
          fill="none" stroke="url(#sGrad1)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Dynamic Accent Overlap (Light Accent) -->
    <path d="M 18 32 L 34 32 C 40.6 32 46 37.4 46 44 C 46 50.6 40.6 56 34 56 L 24 56" 
          fill="none" stroke="url(#sGrad2)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Precision Print Registration Diamond Accent -->
    <polygon points="26,20 30,24 26,28 22,24" fill="#0ea5e9" />
  </g>

  <!-- Typography: SACERDOTI -->
  <text x="74" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="800" fill="#0a192f" letter-spacing="-0.5px">SACERDOTI</text>
  
  <!-- Subtitle: EMPRESA GRÁFICA • EST. 1941 -->
  <text x="75" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.8px">EMPRESA GRÁFICA • DESDE 1941</text>
</svg>
